  <g clip-path="url(#view)">
    <g class="scroll"><text x="48" y="150" class="pl">Good evening everyone,</text><text x="48" y="172" class="pl">thank you for joining</text><text x="48" y="194" class="pl">this presentation.</text><text x="48" y="216" class="pl">Today we explore how</text><text x="48" y="238" class="pl">data turns into insight</text><text x="48" y="260" class="pl">and insight into action.</text><text x="48" y="282" class="pl">Let us begin with</text><text x="48" y="304" class="pl">the first question.</text><text x="48" y="326" class="pl">Good evening everyone,</text><text x="48" y="348" class="pl">thank you for joining</text><text x="48" y="370" class="pl">this presentation.</text><text x="48" y="392" class="pl">Today we explore how</text><text x="48" y="414" class="pl">data turns into insight</text><text x="48" y="436" class="pl">and insight into action.</text><text x="48" y="458" class="pl">Let us begin with</text><text x="48" y="480" class="pl">the first question.</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigglow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>

  <linearGradient id="fl" x1="0" x2="1">
    <stop offset="0" stop-color="#ff0033" stop-opacity="0"/><stop offset="0.5" stop-color="#ff0033"/><stop offset="1" stop-color="#ff0033" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
  .msg { fill:#ff2a3d; font-size:16px; letter-spacing:6px; }
  .sub { fill:#7a0a14; font-size:11px; letter-spacing:4px; }
  .fade { animation: fade 3s ease-in-out infinite; }
  @keyframes fade { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  .scan { stroke-dasharray: 120 2000; animation: run 2.6s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 1060; } to { stroke-dashoffset: -1060; } }
</style>
<line x1="0" y1="30" x2="1000" y2="30" stroke="url(#fl)" stroke-width="1.5"/>
<line class="scan" x1="0" y1="30" x2="1000" y2="30" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
<text class="msg fade" x="500.0" y="72" text-anchor="middle" filter="url(#glow)">[ END OF TRANSMISSION ]</text>
<text class="sub" x="500.0" y="98" text-anchor="middle">CONNECTION SECURED  ::  SESSION KEPT ALIVE</text>
</svg>

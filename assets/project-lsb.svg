<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
  .t { fill:#ff2a3d; font-size:21px; font-weight:800; letter-spacing:2px; }
  .s { fill:#ffb3ba; font-size:12px; }
  .dim { fill:#7a0a14; font-size:11px; letter-spacing:2px; }
  .lbl { fill:#ffd6da; font-size:12px; letter-spacing:1px; }
  .tag { fill:#ffd6da; font-size:11px; letter-spacing:1px; }
  .acc { fill:#ff2a3d; font-size:12px; letter-spacing:2px; }
  .edge { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity:.4; } 50% { stroke-opacity:1; } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0% { opacity:1; } 50% { opacity:0; } }
  .run { stroke-dasharray: 70 900; animation: run 3s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -900; } }
  .px { animation: px 3s ease-in-out infinite; }@keyframes px { 0%,100% { opacity:.9; } 50% { opacity:.6; } }.sel { animation: sel 4s steps(1) infinite; }@keyframes sel { 0% { transform: translate(0,0); } 25% { transform: translate(54px,27px); } 50% { transform: translate(108px,81px); } 75% { transform: translate(27px,108px); } }.bit { fill:#ffb3ba; font-size:16px; font-weight:700; }.lsb { fill:#ffffff; }.sec { fill:#ffffff; font-size:15px; letter-spacing:1px; }.cover { transform-box: fill-box; transform-origin: right; animation: type 5s infinite; }@keyframes type { 0% { transform: scaleX(1); animation-timing-function: steps(10); } 50% { transform: scaleX(0); } 85% { transform: scaleX(0); } 86%,100% { transform: scaleX(1); } }.lb { opacity:0; animation: lb 2s steps(1) infinite; }@keyframes lb { 0% { opacity:1; } 50.00% { opacity:0; } 100% { opacity:0; } }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 502" width="1000" height="502">
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigglow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>

  <linearGradient id="bargrad" x1="0" x2="1">
    <stop offset="0" stop-color="#7a0010"/><stop offset="1" stop-color="#ff2a3d"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0002"/><stop offset="1" stop-color="#140004"/>
  </linearGradient>
</defs>
<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size:17px; white-space:pre; }
  .cmd { fill:#ffffff; }
  .out { fill:#ffb3ba; }
  .tag { fill:#ffd6da; font-size:14px; letter-spacing:1px; }
  .title { fill:#ff7a85; font-size:13px; letter-spacing:2px; }
  .show { opacity:0; animation: show .01s linear forwards; }
  @keyframes show { to { opacity:1; } }
  .cover { transform-box: fill-box; transform-origin: right center; }
  @keyframes type { to { transform: scaleX(0); } }
  .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0% { opacity:1; } 50% { opacity:0; } }
  .edge { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity:.45; } 50% { stroke-opacity:1; } }
</style>

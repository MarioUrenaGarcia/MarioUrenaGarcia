<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290">
<defs>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigglow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0002"/><stop offset="1" stop-color="#170005"/>
  </linearGradient>
  
</defs>
<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
  .t { fill:#ff2a3d; font-size:21px; font-weight:800; letter-spacing:2px; }
  .s { fill:#ffb3ba; font-size:12px; }
  .dim { fill:#7a0a14; font-size:11px; letter-spacing:2px; }
  .lbl { fill:#ffd6da; font-size:12px; letter-spacing:1px; }
  .tag { fill:#ffd6da; font-size:11px; letter-spacing:1px; }
  .acc { fill:#ff2a3d; font-size:12px; letter-spacing:2px; }
  .edge { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity:.4; } 50% { stroke-opacity:1; } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0% { opacity:1; } 50% { opacity:0; } }
  .run { stroke-dasharray: 70 900; animation: run 3s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -900; } }
  .pt { opacity:0; animation: pt 6s ease-out infinite both; }@keyframes pt { 0% { opacity:0; } 6% { opacity:1; } 85% { opacity:1; } 95%,100% { opacity:0; } }.reg { stroke-dasharray: 260; stroke-dashoffset: 260; animation: reg 6s ease-in-out infinite; }@keyframes reg { 0%,30% { stroke-dashoffset:260; opacity:1; } 50%,85% { stroke-dashoffset:0; opacity:1; } 95%,100% { stroke-dashoffset:0; opacity:0; } }.gauss { stroke-dasharray: 330; stroke-dashoffset: 330; animation: gauss 6s ease-in-out infinite; }@keyframes gauss { 0%,25% { stroke-dashoffset:330; opacity:1; } 55%,85% { stroke-dashoffset:0; opacity:1; } 95%,100% { stroke-dashoffset:0; opacity:0; } }.bar { transform-box: fill-box; transform-origin: bottom; animation: bar 6s ease-out infinite both; }@keyframes bar { 0% { transform: scaleY(0); } 15%,85% { transform: scaleY(1); } 95%,100% { transform: scaleY(0); } }
</style>

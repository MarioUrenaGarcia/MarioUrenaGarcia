<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290">
<defs>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigglow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0002"/><stop offset="1" stop-color="#170005"/>
  </linearGradient>
  
</defs>
<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
  .t { fill:#ff2a3d; font-size:21px; font-weight:800; letter-spacing:2px; }
  .s { fill:#ffb3ba; font-size:12px; }
  .dim { fill:#7a0a14; font-size:11px; letter-spacing:2px; }
  .lbl { fill:#ffd6da; font-size:12px; letter-spacing:1px; }
  .tag { fill:#ffd6da; font-size:11px; letter-spacing:1px; }
  .acc { fill:#ff2a3d; font-size:12px; letter-spacing:2px; }
  .edge { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity:.4; } 50% { stroke-opacity:1; } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0% { opacity:1; } 50% { opacity:0; } }
  .run { stroke-dasharray: 70 900; animation: run 3s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -900; } }
  .radar { transform-origin: 120px 160px; animation: spin 3.2s linear infinite; }@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }.blip { opacity:0; animation: blip 3.2s ease-out infinite both; }@keyframes blip { 0% { opacity:1; } 60%,100% { opacity:0; } }.shot { opacity:0; animation: shot 8s ease-out infinite both; }@keyframes shot { 0% { opacity:0; } 3% { opacity:1; } 88% { opacity:1; } 95%,100% { opacity:0; } }.hit { fill:#ff2a3d; font-size:12px; letter-spacing:2px; animation: blink 1.2s steps(1) infinite; }
</style>
<rect x="2" y="2" width="496" height="286" rx="10" fill="url(#bg)"/>
<rect class="edge" x="2" y="2" width="496" height="286" rx="10" fill="none" stroke="#ff0033" stroke-width="2" filter="url(#glow)"/>

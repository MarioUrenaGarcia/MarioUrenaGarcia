<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290">
<defs>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigglow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0002"/><stop offset="1" stop-color="#170005"/>
  </linearGradient>
  
</defs>
<style>
  text { font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
  .t { fill:#ff2a3d; font-size:21px; font-weight:800; letter-spacing:2px; }
  .s { fill:#ffb3ba; font-size:12px; }
  .dim { fill:#7a0a14; font-size:11px; letter-spacing:2px; }
  .lbl { fill:#ffd6da; font-size:12px; letter-spacing:1px; }
  .tag { fill:#ffd6da; font-size:11px; letter-spacing:1px; }
  .acc { fill:#ff2a3d; font-size:12px; letter-spacing:2px; }
  .edge { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity:.4; } 50% { stroke-opacity:1; } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0% { opacity:1; } 50% { opacity:0; } }
  .run { stroke-dasharray: 70 900; animation: run 3s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -900; } }
  .lm { animation: lm 1.6s ease-in-out infinite; }@keyframes lm { 0%,100% { opacity:1; } 50% { opacity:.35; } }.sweep { animation: sweep 2.2s ease-in-out infinite alternate; }@keyframes sweep { from { transform: translateY(0); } to { transform: translateY(132px); } }.big { fill:#ffffff; font-size:24px; font-weight:800; letter-spacing:3px; }.red { fill:#ff2a3d; }.win { fill:#ff2a3d; font-size:13px; letter-spacing:2px; animation: blink 1.5s steps(1) infinite; }.conf { transform-box: fill-box; transform-origin: left; animation: conf 1.5s ease-out infinite; }@keyframes conf { from { transform: scaleX(0); } 70%,to { transform: scaleX(1); } }.cy { opacity:0; animation: cy 4.5s steps(1) infinite; }@keyframes cy { 0% { opacity:1; } 33.33% { opacity:0; } 100% { opacity:0; } }
</style>
<rect x="2" y="2" width="496" height="286" rx="10" fill="url(#bg)"/>
